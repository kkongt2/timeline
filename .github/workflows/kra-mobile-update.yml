name: Update KRA mobile data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kra-mobile-update.yml"
  schedule:
    # Thu-Sun 09:00-21:59 KST; preserve first pre-race forecasts and settled results.
    - cron: "*/10 0-12 * * 4,5,6,0"
    - cron: "5 0 * * 1,2,3"

permissions:
  contents: write

concurrency:
  group: kra-mobile-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: kra-mobile-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 charset-normalizer

      - name: Validate collector
        run: python -m py_compile scripts/update_kra.py

      - name: Collect KRA race cards
        run: python scripts/update_kra.py

      - name: Recover delayed official outcomes
        run: python scripts/settle_snapshots.py

      - name: Freeze pre-race predictions and score official results
        run: node scripts/snapshot.cjs

      - name: Show collection status
        run: |
          python - <<'PY'
          import json
          x=json.load(open("data/latest.json",encoding="utf-8"))
          print(json.dumps(x.get("status",{}),ensure_ascii=False,indent=2))
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Update KRA race data"
            git pull --rebase origin kra-mobile-pages
            git push origin HEAD:kra-mobile-pages
          fi
