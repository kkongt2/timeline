name: Update KRA mobile data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kra-mobile-update.yml"
  schedule:
    # Fri/Sat/Sun, 09:00-21:59 KST (UTC 00:00-12:59), every 10 minutes. Context v3.
    - cron: "*/10 0-12 * * 5,6,0"

permissions:
  contents: write

concurrency:
  group: kra-mobile-data
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: kra-mobile-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 charset-normalizer

      - name: Collect KRA race cards
        run: python scripts/update_kra.py

      - name: Show collection status
        run: |
          python - <<'PY'
          import json
          x=json.load(open("data/latest.json",encoding="utf-8"))
          print(json.dumps(x.get("status",{}),ensure_ascii=False,indent=2))
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/debug.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Update KRA race data"
            git pull --rebase origin kra-mobile-pages
            git push origin HEAD:kra-mobile-pages
          fi
