name: Probe KRA weight handler
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-kra-weight.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe
        shell: python
        run: |
          import re, urllib.request
          url="https://race.kra.co.kr/thisweekrace/ThisWeekWeight.do?Act=04&Sub=4&meet=3"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          b=urllib.request.urlopen(req,timeout=20).read()
          for enc in ("cp949","euc-kr","utf-8"):
              try:
                  s=b.decode(enc); break
              except: pass
          p=s.find("goDetail")
          print(s[max(0,p-1500):p+3000])
