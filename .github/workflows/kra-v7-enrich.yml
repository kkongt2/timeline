name: Enrich KRA history v7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kra-v7-enrich.yml', 'scripts/model-research/collect_v7.py']
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - uses: actions/cache/restore@v4
        with:
          path: training/raw
          key: kra-history-v1-v7-${{ github.run_id }}
          restore-keys: kra-history-v1-
      - run: python scripts/model-research/collect_v7.py
      - name: Save enriched records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/history-v7.jsonl.gz training/quality-v7.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve sectionals and verified place outcomes for v7 research'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kra-v7-data-quality
          path: training/quality-v7.json
