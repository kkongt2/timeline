name: Train KRA historical model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kra-model-training.yml', 'scripts/model-research/**']
permissions:
  contents: write
concurrency:
  group: kra-history-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 numpy scipy
      - uses: actions/cache/restore@v4
        with:
          path: training/raw
          key: kra-history-v1-${{ github.run_id }}
          restore-keys: kra-history-v1-
      - name: Collect validated daily results from 2024
        run: python scripts/model-research/collect.py --end 20260910
      - name: Train and evaluate on held-out dates
        run: python scripts/model-research/train.py --input training/history.jsonl --output data
      - name: Preserve research dataset and evaluation
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          p=Path('training/history.jsonl')
          Path('training/history.jsonl.gz').write_bytes(gzip.compress(p.read_bytes(),mtime=0))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/training-report.json data/candidate-model.json training/history.jsonl.gz training/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save historical training data and held-out evaluation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: training/raw
          key: kra-history-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kra-training-evidence
          path: |
            training/manifest.json
            data/training-report.json
            data/candidate-model.json
          if-no-files-found: ignore
